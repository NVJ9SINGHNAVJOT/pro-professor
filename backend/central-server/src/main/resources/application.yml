spring:
  application:
    name: central-server

  profiles:
    active: ${ENVIRONMENT:development}

  # ── Graceful shutdown ────────────────────────────────────────────────────────
  # On SIGINT/SIGTERM, wait up to this long for in-flight chat streams / audio calls
  # to finish before beans are destroyed (pairs with server.shutdown: graceful).
  lifecycle:
    timeout-per-shutdown-phase: 60s

  # ── Runtime footprint (low-memory tuning) ────────────────────────────────────
  threads:
    virtual:
      enabled: true            # Java 21+ virtual threads — serve requests without a large platform-thread pool
  main:
    lazy-initialization: true  # defer bean creation until first use → lower startup memory
  jmx:
    enabled: false             # drop the unused JMX MBean machinery

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_PORT:5432}/${POSTGRES_DB:AI-Professor-Database}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    # Small pool — low-traffic service; each idle connection holds client + server memory.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  # ── Multipart (voice clips uploaded to /api/v1/audio/transcriptions) ─────────
  servlet:
    multipart:
      max-file-size: ${MAX_AUDIO_UPLOAD_SIZE:25MB}
      max-request-size: ${MAX_AUDIO_UPLOAD_SIZE:25MB}

# ── Server ─────────────────────────────────────────────────────────────────
server:
  port: ${PORT:4000}
  shutdown: graceful           # drain in-flight requests before shutting down
  # With virtual threads on, requests don't need the default 200-thread pool.
  tomcat:
    threads:
      max: 20
      min-spare: 2

# ── Logging ──────────────────────────────────────────────────────────────────
# Inject the per-request correlation id (set in RequestIdFilter's MDC) into every
# log line, right after the level. "-" renders when no id is present.
logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

# ── Actuator (exposes /actuator/health with the db component) ────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# ── Application-specific config (bound to AppProperties) ─────────────────────
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
    api-key: ${AI_SERVICE_API_KEY:test-key}
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    api-key: ${OLLAMA_API_KEY:ollama}
  storage-service:
    base-url: ${STORAGE_SERVICE_BASE_URL:http://127.0.0.1:9000}
