---
version: "3"

tasks:
  default:
    desc: List all tasks.
    cmd: task -l

  dev:
    desc: Run the Spring Boot server in dev mode (hot reload via spring-boot:run)
    cmds:
      - ./mvnw spring-boot:run

  codegen:
    desc: Generate jOOQ classes from the current Postgres schema
    dotenv:
      - .env
    cmds:
      - ./mvnw org.jooq:jooq-codegen-maven:generate

  migrate:
    desc: Run pending Flyway migrations against the database
    dotenv:
      - .env
    cmds:
      - ./mvnw flyway:migrate -Dflyway.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB} -Dflyway.user=${POSTGRES_USER} -Dflyway.password=${POSTGRES_PASSWORD}

  build:
    desc: Compile and package the Java server into a JAR (skips tests)
    cmds:
      - ./mvnw package -DskipTests

  start:
    desc: Run the packaged JAR produced by the build task (tuned for low memory footprint)
    cmds:
      - java -Xms64m -Xmx256m -XX:+UseSerialGC -XX:+UseCompactObjectHeaders -XX:MaxMetaspaceSize=192m -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError -jar target/central-server-0.0.1-SNAPSHOT.jar

  audit:
    desc: Scan dependencies for known CVEs using OWASP Dependency Check
    cmds:
      - ./mvnw verify
