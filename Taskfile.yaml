---
version: "3"

interval: 500ms

includes:
  backend:
    taskfile: backend/central-server/Taskfile.yaml
    dir: backend/central-server
  storage:
    taskfile: backend/storage-server/Taskfile.yaml
    dir: backend/storage-server
  ai:
    taskfile: backend/ai-service/Taskfile.yaml
    dir: backend/ai-service
  frontend:
    taskfile: frontend/Taskfile.yaml
    dir: frontend

tasks:
  default:
    desc: List all tasks.
    cmd: task -l

  init:
    desc: Bootstrap a fresh clone (ai-service, frontend, backend — deps + .env files)
    cmds:
      - bash scripts/setup.sh

  setup:ai:
    desc: Set up ai-service (submodule, venv, dependencies, .env)
    cmds:
      - bash scripts/setup-ai-service.sh

  db:backup:
    desc: Dump the central-server Postgres DB to a timestamped file in tmp/ (checks Postgres is running)
    cmds:
      - bash scripts/backup-db.sh

  db:restore:
    desc: Restore the central-server Postgres DB from a dump (FILE=tmp/<dump>.sql; prompts before overwriting)
    cmds:
      - bash scripts/restore-db.sh "{{.FILE}}"
