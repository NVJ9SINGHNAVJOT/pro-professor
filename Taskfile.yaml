---
version: "3"

interval: 500ms

includes:
  backend: backend/central-server/Taskfile.yaml
  storage: backend/storage-service/Taskfile.yml
  ai: backend/ai-service/Taskfile.yaml
  frontend: frontend/Taskfile.yaml

tasks:
  default:
    desc: List all tasks.
    cmd: task -l

  init:
    desc: Bootstrap a fresh clone (ai-service, storage-service, frontend, backend — deps + .env files)
    cmds:
      - bash scripts/setup.sh

  setup:storage:
    desc: Fetch storage-service (and its shared modules) from the external micro-yard repo
    cmds:
      - bash scripts/setup-storage-service.sh

  setup:ai:
    desc: Set up ai-service (submodule, venv, dependencies, .env)
    cmds:
      - bash scripts/setup-ai-service.sh
