---
version: "3"

tasks:
  default:
    desc: List all tasks.
    cmd: task -l

  dev:
    desc: Start the Vite dev server
    cmds:
      - npm run dev

  build:
    desc: Type-check and build the production bundle
    cmds:
      - npm run build

  lint:
    desc: Run ESLint
    cmds:
      - npm run lint

  preview:
    desc: Preview the production build locally
    cmds:
      - npm run preview

  format:
    desc: Format all files with Prettier
    cmds:
      - npm run format

  format:check:
    desc: Check formatting without writing changes
    cmds:
      - npm run format:check
